name: Setup
description: Node with the npm dependencies, and the LLVM toolchain the C engine builds with

runs:
    using: composite
    steps:
        - uses: actions/setup-node@v4
          with:
              node-version: 24
              cache: npm

        - run: npm ci
          shell: bash

        # Pinned to the major the repo is formatted with: clang-format's output drifts between
        # versions, and a local 22 against a CI 19 would fail `format:check` on untouched code.
        - run: |
              curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/llvm.asc > /dev/null
              codename=$(lsb_release -cs)
              echo "deb [signed-by=/etc/apt/keyrings/llvm.asc] https://apt.llvm.org/$codename/ llvm-toolchain-$codename-22 main" \
                  | sudo tee /etc/apt/sources.list.d/llvm.list
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                  clang-22 lld-22 llvm-22 clang-tidy-22 clang-format-22 libclang-rt-22-dev
              echo "CLANG=clang-22" >> "$GITHUB_ENV"
          shell: bash
