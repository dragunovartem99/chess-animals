name: Deploy

on:
    push:
        branches: [main]

jobs:
    # A red CI run blocks the deploy: it only starts once the same checks that gate pull
    # requests have passed on this commit.
    ci:
        uses: ./.github/workflows/ci.yaml

    deploy:
        needs: ci
        uses: dragunovartem99/pipes/.github/workflows/deploy-vps.yaml@v1.1.0
        with:
            strategy: release
            setup: node
            llvm-version: "22"
            build: npm run build
            upload: dist/ Caddyfile deploy.sh
            url: https://chess-animals.com
        secrets: inherit
