name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run types:check
            - run: npm run lint:check
            - run: npm run test:coverage
            - run: npm run build
