# Who each animal is and how it sounds. `character` and `speaks` drive the lines; `gender` to
# `delivery` build the Voice Design prompt (cli/voice/describe.ts), so a stock voice keeps them too,
# ready for the day it is designed. A comment after `voice` names a stock or library voice.

donkey:
    voice: c5XTzZfSskN4Ut6RVcrx
    gender: male
    age: middle-aged
    persona: stubborn village donkey
    emotion: sullen, obstinate, flat
    delivery: A slow country drawl, low and nasal, dragging the vowels. Will not be hurried.
    character: stubborn, digs in and won't budge, denies what he didn't see
    speaks: he
