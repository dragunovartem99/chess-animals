# Who each animal is and how it sounds. `character` and `speaks` drive the lines; `gender` to
# `delivery` build the Voice Design prompt (cli/voice/describe.ts), so a stock voice keeps them too,
# ready for the day it is designed. A comment after `voice` names a stock or library voice.

donkey:
    voice: oubi7HGxNVjXMnWLgwBT # library Cletus
    gender: male
    age: a cartoon farm animal
    persona: stubborn redneck donkey
    emotion: sullen, obstinate, flat
    delivery: A non-human cartoon donkey voice. A slow, sullen hillbilly drawl, heavily nasal and twangy, like a stubborn backwoods farmhand, dragging the vowels. Will not be hurried. Exaggerated and goofy, clear, not muffled.
    character: stubborn, digs in and won't budge, denies what he didn't see
    speaks: he
dove:
    voice: tXtmoClvKMDIT6yAj5Ew
    gender: female
    age: a young girl
    persona: shy apologetic dove
    emotion: timid, sorry, gentle
    delivery: A breathy near-whisper, soft and high, trailing off as if afraid to be heard.
    character: shy, sorry for everything, even for winning
    speaks: she
lemming:
    voice: fBD19tfE58bkETeiwUoC # library Little Dude II
    gender: male
    age: a small wild critter
    persona: reckless daredevil
    emotion: wild, thrilled, fearless
    delivery: A non-human critter voice, very high-pitched and shrill, higher than any man's. A wild daredevil screaming at the top of his lungs with manic glee, fast and breathless, shrieking before thinking, like leaping off a cliff. Unhinged and over the top, but clear, not distorted.
    character: a reckless daredevil, jumps first and never looks
    speaks: he
